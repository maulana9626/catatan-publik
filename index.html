<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Notes</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--text);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        font-size: clamp(1.6rem, 3vw, 2.3rem);
        font-weight: 700;
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 6px;
      }

      .badge {
        background: var(--primary);
        color: white;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
      }

      .form-card h2 {
        margin: 0 0 14px 0;
        font-size: 1.3rem;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        background: white;
        color: var(--text);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus, textarea:focus {
        outline: 2px solid rgba(37, 99, 235, 0.15);
        border-color: var(--primary);
      }

      .button-row {
        display: flex;
        justify-content: flex-end;
      }

      button {
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: white;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        transition: 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .note {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
      }

      .note h3 {
        margin: 0 0 10px;
        font-size: 1.1rem;
      }

      .note p {
        margin: 0;
        line-height: 1.7;
        color: #334155;
        white-space: pre-wrap;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 16px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 18px;
        background: rgba(255,255,255,0.4);
        padding: 28px 16px;
      }

      @media (max-width: 640px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1 class="brand">Public Notes</h1>
          <div class="subtitle">Semua orang bisa melihat dan menulis catatan</div>
        </div>
        <div class="badge">Public</div>
      </div>

      <div class="form-card">
        <h2>Buat Catatan Baru</h2>
        <form id="noteForm">
          <label>
            Judul
            <input type="text" id="title" maxlength="80" placeholder="Masukkan judul catatan" required />
          </label>

          <label>
            Isi catatan
            <textarea id="content" placeholder="Tulis isi catatan Anda..." required></textarea>
          </label>

          <div class="button-row">
            <button type="submit">Simpan Catatan</button>
          </div>
        </form>
      </div>

      <div id="notes" class="notes-grid"></div>
    </div>

    <script>
      const STORAGE_KEY = 'public_notes_data';
      const notesEl = document.getElementById('notes');
      const form = document.getElementById('noteForm');

      function loadNotes() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [
          {
            id: 1,
            title: 'Selamat datang',
            content: 'Ini adalah catatan publik demo. Siapa pun bisa melihat dan menambah catatan di halaman ini.',
            createdAt: new Date().toISOString()
          }
        ];
      }

      function saveNotes(notes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function renderNotes() {
        const notes = loadNotes();

        if (!notes.length) {
          notesEl.innerHTML = '<div class="empty">Belum ada catatan. Jadilah yang pertama menulis.</div>';
          return;
        }

        notesEl.innerHTML = notes
          .slice()
          .reverse()
          .map(note => {
            const date = new Date(note.createdAt).toLocaleString('id-ID', {
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            return `
              <article class="note">
                <h3>${escapeHtml(note.title)}</h3>
                <p>${escapeHtml(note.content)}</p>
                <div class="meta">
                  <span>Public</span>
                  <span>${date}</span>
                </div>
              </article>
            `;
          })
          .join('');
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();

        if (!title || !content) return;

        const notes = loadNotes();
        notes.push({
          id: Date.now(),
          title,
          content,
          createdAt: new Date().toISOString()
        });

        saveNotes(notes);
        renderNotes();
        form.reset();
      });

      renderNotes();
    </script>
  </body>
</html>
